# Render Blueprint: a free, temporary deployment without Docker.
#   Render dashboard -> New -> Blueprint -> pick this repository -> Apply.
# It creates three resources in one region:
#   task-register-db   Render Postgres (free: 1 GB, expires 30 days after creation)
#   task-register-api  Django + DRF on Render's native Python runtime (free: sleeps after 15 idle minutes)
#   task-register      the React app as a static site; it forwards /api, /admin and /static to the API,
#                      so the browser sees one address and the sign-in cookies and CSRF check just work.
# The public addresses follow the service names. If Render reports a name as taken and adds a suffix,
# update the three "https://task-register-api.onrender.com" routes below and the two DJANGO_* values
# that name task-register.onrender.com, then sync the Blueprint again. See docs/render.md.

databases:
  - name: task-register-db
    plan: free
    region: frankfurt
    databaseName: task_register
    user: task_register

services:
  # ---- Django API ---------------------------------------------------------------------------
  - type: web
    name: task-register-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # Free services have no pre-deploy step or shell, so the start command prepares the database:
    # migrations, roles and permissions, the initial data and the demo tasks (tasks skipped when already
    # loaded). Set SEED_DEMO_RESET to "true" for one deploy to wipe the register and start again from the
    # initial data (then set it back to "false").
    startCommand: >-
      python manage.py migrate --noinput
      && python manage.py setup_roles
      && if [ "$SEED_DEMO_RESET" = "true" ]; then python manage.py seed_demo --reset; else python manage.py seed_demo; fi
      && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2
      --access-logfile - --forwarded-allow-ips "*"
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        fromDatabase:
          name: task-register-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      # The API's own host is added automatically (RENDER_EXTERNAL_HOSTNAME); this adds the front end's.
      - key: DJANGO_ALLOWED_HOSTS
        value: task-register-elty.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://task-register-elty.onrender.com
      - key: DJANGO_SECURE_COOKIES
        value: "True"
      # Render serves HTTPS only; the API also redirects plain HTTP and asks browsers to stay on HTTPS.
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: DJANGO_HSTS_SECONDS
        value: "31536000"
      - key: DJANGO_LOG_LEVEL
        value: INFO
      # Password of the trial users (admin, tmo.officer, ict.team, ...) and of the group members'
      # accounts created from the focal points list (amr.gomaa, shadi.alghanim, ...). Render asks for it once.
      - key: DEMO_USER_PASSWORD
        sync: false
      # "true" for one deploy wipes the register and reloads the initial data and demo tasks.
      - key: SEED_DEMO_RESET
        value: "false"

  # ---- React front end ----------------------------------------------------------------------
  - type: web
    name: task-register
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "20"
    # Security headers for the web app (OWASP A05), the same as the Docker nginx sends
    # (frontend/docker/security-headers.conf): a strict Content-Security-Policy with no inline scripts,
    # no framing (clickjacking), no MIME sniffing, HTTPS only, and no camera / microphone / location.
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: same-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /index.html
        name: Cache-Control
        value: no-cache
    # Rules run top to bottom, and only when no built file matches the path.
    routes:
      - type: rewrite
        source: /api/*
        destination: https://task-register-api.onrender.com/api/*
      - type: rewrite
        source: /admin/*
        destination: https://task-register-api.onrender.com/admin/*
      - type: rewrite
        source: /static/*
        destination: https://task-register-api.onrender.com/static/*
      # Links such as /tasks/12 and page refreshes load the React app.
      - type: rewrite
        source: /*
        destination: /index.html
